name: ci-aspnet

on:
  push:
    branches: [main]
    paths:
      - 'src/ZcapLd.AspNetCore/**'
      - 'src/ZcapLd.Core/**'
      - 'tests/ZcapLd.Core.Tests/**'
      - 'ZcapLd.sln'
      - '.github/workflows/ci-aspnet.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/ZcapLd.AspNetCore/**'
      - 'src/ZcapLd.Core/**'
      - 'tests/ZcapLd.Core.Tests/**'
      - 'ZcapLd.sln'
      - '.github/workflows/ci-aspnet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack-aspnet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore src/ZcapLd.Core/ZcapLd.Core.csproj
          dotnet restore src/ZcapLd.AspNetCore/ZcapLd.AspNetCore.csproj
          dotnet restore tests/ZcapLd.Core.Tests/ZcapLd.Core.Tests.csproj

      - name: Build
        run: |
          dotnet build src/ZcapLd.Core/ZcapLd.Core.csproj --configuration Release --no-restore
          dotnet build src/ZcapLd.AspNetCore/ZcapLd.AspNetCore.csproj --configuration Release --no-restore
          dotnet build tests/ZcapLd.Core.Tests/ZcapLd.Core.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/ZcapLd.Core.Tests/ZcapLd.Core.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Pack ASP.NET adapter package
        run: dotnet pack src/ZcapLd.AspNetCore/ZcapLd.AspNetCore.csproj --configuration Release --no-build -o artifacts/aspnet

      - name: Upload ASP.NET adapter package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aspnet-nuget-packages
          path: |
            artifacts/aspnet/*.nupkg
            artifacts/aspnet/*.snupkg
          if-no-files-found: error
