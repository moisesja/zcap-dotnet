name: ci-core

on:
  push:
    branches: [main]
    paths:
      - 'src/ZcapLd.Core/**'
      - 'tests/ZcapLd.Core.Tests/**'
      - 'examples/ZcapLd.Examples/**'
      - 'ZcapLd.sln'
      - '.github/workflows/ci-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/ZcapLd.Core/**'
      - 'tests/ZcapLd.Core.Tests/**'
      - 'examples/ZcapLd.Examples/**'
      - 'ZcapLd.sln'
      - '.github/workflows/ci-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore src/ZcapLd.Core/ZcapLd.Core.csproj
          dotnet restore tests/ZcapLd.Core.Tests/ZcapLd.Core.Tests.csproj
          dotnet restore examples/ZcapLd.Examples/ZcapLd.Examples.csproj

      - name: Clean
        run: |
          dotnet clean src/ZcapLd.Core/ZcapLd.Core.csproj --configuration Release
          dotnet clean tests/ZcapLd.Core.Tests/ZcapLd.Core.Tests.csproj --configuration Release
          dotnet clean examples/ZcapLd.Examples/ZcapLd.Examples.csproj --configuration Release

      - name: Build
        run: |
          dotnet build src/ZcapLd.Core/ZcapLd.Core.csproj --configuration Release --no-restore --no-incremental
          dotnet build tests/ZcapLd.Core.Tests/ZcapLd.Core.Tests.csproj --configuration Release --no-restore --no-incremental
          dotnet build examples/ZcapLd.Examples/ZcapLd.Examples.csproj --configuration Release --no-restore --no-incremental

      - name: Test
        run: dotnet test tests/ZcapLd.Core.Tests/ZcapLd.Core.Tests.csproj --configuration Release --no-build --verbosity normal

      # The example checks every outcome it prints (#166); a mismatch exits non-zero and fails the job.
      - name: Run console example
        run: dotnet run --project examples/ZcapLd.Examples/ZcapLd.Examples.csproj --configuration Release --no-build

      - name: Pack core package
        run: dotnet pack src/ZcapLd.Core/ZcapLd.Core.csproj --configuration Release --no-build -o artifacts/core

      - name: Upload core package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-nuget-packages
          path: |
            artifacts/core/*.nupkg
            artifacts/core/*.snupkg
          if-no-files-found: error
