name: ci-core

on:
  push:
    branches: [main]
    paths:
      - 'src/ZcapLd.Core/**'
      - 'tests/ZcapLd.Core.Tests/**'
      - 'examples/ZcapLd.Examples/**'
      - 'ZcapLd.sln'
      - '.github/workflows/ci-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/ZcapLd.Core/**'
      - 'tests/ZcapLd.Core.Tests/**'
      - 'examples/ZcapLd.Examples/**'
      - 'ZcapLd.sln'
      - '.github/workflows/ci-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore src/ZcapLd.Core/ZcapLd.Core.csproj
          dotnet restore tests/ZcapLd.Core.Tests/ZcapLd.Core.Tests.csproj

      - name: Build
        run: |
          dotnet build src/ZcapLd.Core/ZcapLd.Core.csproj --configuration Release --no-restore
          dotnet build tests/ZcapLd.Core.Tests/ZcapLd.Core.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/ZcapLd.Core.Tests/ZcapLd.Core.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Pack core package
        run: dotnet pack src/ZcapLd.Core/ZcapLd.Core.csproj --configuration Release --no-build -o artifacts/core

      - name: Upload core package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-nuget-packages
          path: |
            artifacts/core/*.nupkg
            artifacts/core/*.snupkg
          if-no-files-found: error
