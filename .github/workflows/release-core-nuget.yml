name: release-core-nuget

on:
  push:
    tags:
      - 'core-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Core package version (for example 0.2.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#core-v}"
          else
            VERSION="${{ inputs.version }}"
          fi

          if [[ -z "$VERSION" ]]; then
            echo "Version is empty."
            exit 1
          fi

          ASSEMBLY_VERSION="${VERSION%%-*}.0"
          echo "package_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "assembly_version=$ASSEMBLY_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved core package version: $VERSION"

      - name: Restore
        run: |
          dotnet restore src/ZcapLd.Core/ZcapLd.Core.csproj
          dotnet restore tests/ZcapLd.Core.Tests/ZcapLd.Core.Tests.csproj

      - name: Build
        run: |
          dotnet build src/ZcapLd.Core/ZcapLd.Core.csproj \
            --configuration Release \
            --no-restore \
            -p:Version=${{ steps.version.outputs.package_version }} \
            -p:PackageVersion=${{ steps.version.outputs.package_version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} \
            -p:FileVersion=${{ steps.version.outputs.assembly_version }}
          dotnet build tests/ZcapLd.Core.Tests/ZcapLd.Core.Tests.csproj \
            --configuration Release \
            --no-restore \
            -p:Version=${{ steps.version.outputs.package_version }} \
            -p:PackageVersion=${{ steps.version.outputs.package_version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} \
            -p:FileVersion=${{ steps.version.outputs.assembly_version }}

      - name: Test
        run: dotnet test tests/ZcapLd.Core.Tests/ZcapLd.Core.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Pack core package
        run: |
          dotnet pack src/ZcapLd.Core/ZcapLd.Core.csproj \
            --configuration Release \
            --no-build \
            -p:Version=${{ steps.version.outputs.package_version }} \
            -p:PackageVersion=${{ steps.version.outputs.package_version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} \
            -p:FileVersion=${{ steps.version.outputs.assembly_version }} \
            -o artifacts/core

      - name: Upload core package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-nuget-release-${{ steps.version.outputs.package_version }}
          path: |
            artifacts/core/*.nupkg
            artifacts/core/*.snupkg
          if-no-files-found: error

      - name: Resolve NuGet API key
        id: apikey
        shell: bash
        run: |
          API_KEY="${{ secrets.NUGET_API_KEY_CORE }}"
          if [[ -z "$API_KEY" ]]; then
            API_KEY="${{ secrets.NUGET_API_KEY }}"
          fi

          if [[ -z "$API_KEY" ]]; then
            echo "Neither NUGET_API_KEY_CORE nor NUGET_API_KEY is configured."
            exit 1
          fi

          echo "api_key=$API_KEY" >> "$GITHUB_OUTPUT"

      - name: Publish core package to NuGet.org
        run: dotnet nuget push "artifacts/core/ZcapLd.Core.*.nupkg" --api-key "${{ steps.apikey.outputs.api_key }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate

      - name: Publish core symbols to NuGet.org
        run: dotnet nuget push "artifacts/core/ZcapLd.Core.*.snupkg" --api-key "${{ steps.apikey.outputs.api_key }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
