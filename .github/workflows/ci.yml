name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ZcapLd.sln

      - name: Build
        run: dotnet build ZcapLd.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ZcapLd.sln --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/ZcapLd.Core/ZcapLd.Core.csproj --configuration Release --no-build -o artifacts

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
