name: release-aspnet-nuget

on:
  push:
    tags:
      - 'aspnet-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'ASP.NET adapter package version (for example 0.2.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-aspnet:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#aspnet-v}"
          else
            VERSION="${{ inputs.version }}"
          fi

          if [[ -z "$VERSION" ]]; then
            echo "Version is empty."
            exit 1
          fi

          ASSEMBLY_VERSION="${VERSION%%-*}.0"
          echo "package_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "assembly_version=$ASSEMBLY_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved ASP.NET adapter package version: $VERSION"

      - name: Restore
        run: |
          dotnet restore src/ZcapLd.Core/ZcapLd.Core.csproj
          dotnet restore src/ZcapLd.AspNetCore/ZcapLd.AspNetCore.csproj
          dotnet restore tests/ZcapLd.Core.Tests/ZcapLd.Core.Tests.csproj
          dotnet restore tests/ZcapLd.AspNetCore.Tests/ZcapLd.AspNetCore.Tests.csproj

      - name: Clean
        run: |
          dotnet clean src/ZcapLd.Core/ZcapLd.Core.csproj --configuration Release
          dotnet clean src/ZcapLd.AspNetCore/ZcapLd.AspNetCore.csproj --configuration Release
          dotnet clean tests/ZcapLd.Core.Tests/ZcapLd.Core.Tests.csproj --configuration Release
          dotnet clean tests/ZcapLd.AspNetCore.Tests/ZcapLd.AspNetCore.Tests.csproj --configuration Release

      - name: Build
        run: |
          dotnet build src/ZcapLd.Core/ZcapLd.Core.csproj \
            --configuration Release \
            --no-restore \
            --no-incremental \
            -p:Version=${{ steps.version.outputs.package_version }} \
            -p:PackageVersion=${{ steps.version.outputs.package_version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} \
            -p:FileVersion=${{ steps.version.outputs.assembly_version }}
          dotnet build src/ZcapLd.AspNetCore/ZcapLd.AspNetCore.csproj \
            --configuration Release \
            --no-restore \
            --no-incremental \
            -p:Version=${{ steps.version.outputs.package_version }} \
            -p:PackageVersion=${{ steps.version.outputs.package_version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} \
            -p:FileVersion=${{ steps.version.outputs.assembly_version }}
          dotnet build tests/ZcapLd.Core.Tests/ZcapLd.Core.Tests.csproj \
            --configuration Release \
            --no-restore \
            --no-incremental \
            -p:Version=${{ steps.version.outputs.package_version }} \
            -p:PackageVersion=${{ steps.version.outputs.package_version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} \
            -p:FileVersion=${{ steps.version.outputs.assembly_version }}
          # Also builds examples/ZcapLd.RevocationEndpointsDemo, the test project's system under test.
          dotnet build tests/ZcapLd.AspNetCore.Tests/ZcapLd.AspNetCore.Tests.csproj \
            --configuration Release \
            --no-restore \
            --no-incremental \
            -p:Version=${{ steps.version.outputs.package_version }} \
            -p:PackageVersion=${{ steps.version.outputs.package_version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} \
            -p:FileVersion=${{ steps.version.outputs.assembly_version }}

      - name: Test
        run: |
          dotnet test tests/ZcapLd.Core.Tests/ZcapLd.Core.Tests.csproj --configuration Release --no-build --verbosity normal
          dotnet test tests/ZcapLd.AspNetCore.Tests/ZcapLd.AspNetCore.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Pack ASP.NET adapter package
        run: |
          dotnet pack src/ZcapLd.AspNetCore/ZcapLd.AspNetCore.csproj \
            --configuration Release \
            --no-build \
            -p:Version=${{ steps.version.outputs.package_version }} \
            -p:PackageVersion=${{ steps.version.outputs.package_version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} \
            -p:FileVersion=${{ steps.version.outputs.assembly_version }} \
            -o artifacts/aspnet

      - name: Upload ASP.NET adapter package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aspnet-nuget-release-${{ steps.version.outputs.package_version }}
          path: |
            artifacts/aspnet/*.nupkg
            artifacts/aspnet/*.snupkg
          if-no-files-found: error

  # A separate job because id-token: write covers every step in a job. This one runs no repository
  # or dependency code, so nothing built or tested above can obtain a nuget.org publishing token.
  publish-aspnet:
    needs: build-aspnet
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download ASP.NET adapter package artifacts
        uses: actions/download-artifact@v4
        with:
          name: aspnet-nuget-release-${{ needs.build-aspnet.outputs.package_version }}
          path: artifacts/aspnet

      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: moisesja

      - name: Publish ASP.NET adapter package to NuGet.org
        run: dotnet nuget push "artifacts/aspnet/ZcapLd.AspNetCore.*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate

      - name: Publish ASP.NET adapter symbols to NuGet.org
        run: dotnet nuget push "artifacts/aspnet/ZcapLd.AspNetCore.*.snupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
